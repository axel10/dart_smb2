name: dart_smb2
description: Dart client for SMB2/3 built on libsmb2. Listings, reads, streaming, atomic downloads, writes and cancellation from worker isolates. Targets macOS, Windows, Linux, iOS and Android.
version: 0.2.3
homepage: https://github.com/ales-drnz/dart_smb2
repository: https://github.com/ales-drnz/dart_smb2
issue_tracker: https://github.com/ales-drnz/dart_smb2/issues

topics:
  - cross-platform
  - smb2
  - smb3
  - samba
  - libsmb2

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

screenshots:
  - description: 'The dart_smb2 package logo.'
    path: imgs/dart_smb2.png

environment:
  sdk: ^3.10.0

dependencies:
  # Widened from ^2.1.0: irondash_engine_context (and native_toolchain_rust)
  # still require ^1.0.0, and 1.2.x has the same CodeAsset/userDefines API
  # this hook uses. The 2.0.0 breaking change (==/hashCode on OS and
  # Architecture) does not affect hook/build.dart.
  code_assets: '>=1.0.0 <3.0.0'
  crypto: ^3.0.7
  ffi: ^2.1.3
  hooks: ^2.0.2
  meta: ^1.15.0

dev_dependencies:
  ffigen: ^23.0.0
  lints: ^6.0.0
  test: ^1.26.0

